<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Lấy các ô chứa mã QR
    const qrCells = document.querySelectorAll('td.qr-code');
    
    qrCells.forEach(async (cell) => {
        const text = cell.getAttribute('data-room-text') || '';
        const keyPart = text.split(' ')[0];
        const url = `${window.location.origin}/${keyPart}`;
        
        // Tạo canvas QR code
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        await QRCode.toCanvas(canvas, url, { width: 640 }); // kích thước nhỏ phù hợp ở cột
        
        // Xóa nội dung cũ và thêm canvas QR code
        cell.innerHTML = '';
        cell.appendChild(canvas);
        canvas.style.width = '64px';
        canvas.style.height = '64px';

        const infoDiv = document.createElement('div');
        infoDiv.style.marginTop = '4px';
        infoDiv.style.fontSize = '10px';
        infoDiv.style.textAlign = 'center';
        infoDiv.style.whiteSpace = 'normal'; // cho xuống dòng nếu cần
        infoDiv.innerHTML = `<div style="font-size:4px">${keyPart}</div><div style="color:blue;font-size:2px; word-break: break-word;">${url}</div>`;

        cell.appendChild(infoDiv);
        
        // Thêm sự kiện click mở link trong tab mới
        cell.style.cursor = 'pointer';

        let isDownloading = false;
        
        cell.addEventListener('click', function handler(event) {
            downloadCell(cell, keyPart);
        });
    });
    


    function downloadCell(cell, roomName) {
    html2canvas(cell, { scale: 10 }).then(canvas => {
        canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${window.location.origin.includes("cis")?"cis":"sedbergh"}_${roomName}.png`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        }, 'image/png');
    });
    }

    document.addEventListener('click', async (event) => {
    if(event.target && event.target.id === 'downloadAllQr') {
        event.preventDefault();
        const qrCells = document.querySelectorAll('td.qr-code');
        console.log('qrCells:', qrCells.length);
        const zip = new JSZip();

        for(let i=0; i<qrCells.length; i++) {
            console.log("process", i * 100/qrCells.length);
            const cell = qrCells[i];
            const roomText = cell.getAttribute('data-room-text');

            // Tạo div ẩn ngoài DOM chính để render QR code
            const tempDiv = document.createElement('div');
            tempDiv.style.position = 'absolute';
            tempDiv.style.left = '-9999px';
            document.body.appendChild(tempDiv);

            const text = cell.getAttribute('data-room-text') || '';
            const keyPart = text.split(' ')[0];
            const url = `${window.location.origin}/${keyPart}`;

            await QRCode.toCanvas(tempDiv, url, { width: 256 });

            // Lấy canvas trong div tạm
            const canvas = tempDiv.querySelector('canvas');
            if(!canvas) {
                document.body.removeChild(tempDiv);
                continue;
            }

            // Chuyển canvas thành Blob
            const blob = await new Promise(resolve => canvas.toBlob(resolve));

            // Thêm file ảnh vào zip
            zip.file(`${roomText}.png`, blob);

            // Xóa tempDiv sau khi dùng xong
            document.body.removeChild(tempDiv);
        }

        // Tạo file zip Blob và trigger tải về
        const content = await zip.generateAsync({type:"blob"});
        saveAs(content, "qr_codes.zip");

        console.log('Download triggered');
    }
});

});
</script>
